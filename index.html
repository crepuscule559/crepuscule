<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crepuscule</title>
  <style>
    :root {
      --theme-color: #FFB6C1;
      --bubble-me: #95ec69;
      --bubble-other: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #e8f0fe 0%, #fce8e8 100%); height: 100vh; color: #333; overflow: hidden; display: flex; flex-direction: column; }
    
    /* 视图切换 */
    .view { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
    .view.active { display: flex; }

    /* ====== 主页样式 ====== */
    #viewHome { padding: 20px 16px; overflow-y: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px 20px; font-size: 17px; font-weight: bold; color: #444; }
    .dots { font-size: 24px; cursor: pointer; }
    
    .relation-card { background: rgba(255, 255, 255, 0.8); border-radius: 24px; padding: 25px 20px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .avatar-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .avatar-circle { width: 64px; height: 64px; border-radius: 50%; background: #e0e0e0; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .avatar-name { font-size: 13px; font-weight: bold; color: #555; }
    .connection { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; margin: 0 10px; top: -15px; }
    .line { width: 100%; height: 1px; background: #ffb6c1; position: absolute; z-index: 1; }
    .heart-icon { color: #ff7b9c; font-size: 20px; background: #fff; padding: 0 8px; border-radius: 50%; z-index: 2; }
    
    .section-title { font-size: 14px; font-weight: bold; color: #666; margin: 0 0 12px 5px; }
    .contact-list { background: #fff; border-radius: 20px; padding: 15px; display: flex; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; }
    .contact-avatar { width: 52px; height: 52px; border-radius: 14px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; object-fit: cover; }
    .contact-info { flex: 1; margin-left: 15px; }
    .contact-name { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 6px; }
    .contact-preview { font-size: 13px; color: #888; }
    
    /* ====== 聊天界面 ====== */
    .header { height: 56px; background: var(--theme-color); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; font-weight: bold; }
    .header-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .chat-container { flex: 1; background-color: #f0f2f5; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .input-bar { height: 60px; background: #fff; display: flex; align-items: center; padding: 0 15px; }
    .input-btn { flex: 1; height: 44px; border-radius: 12px; border: none; background: var(--theme-color); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .msg { display: flex; max-width: 85%; align-items: flex-start; }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg.other { align-self: flex-start; }
    .msg.system { align-self: center; background: #ddd; color: #666; font-size: 12px; padding: 4px 10px; border-radius: 10px; }
    .msg-avatar { width: 40px; height: 40px; border-radius: 8px; background: #ddd; object-fit: cover; }
    .msg-content { margin: 0 10px; padding: 12px 16px; border-radius: 12px; font-size: 15px; background: #fff; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .msg.me .msg-content { background: var(--bubble-me); }
    .card-action { display: inline-block; margin-top: 10px; padding: 8px; background: #f0f0f0; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; text-align: center; color: #333; }

    /* ====== 设置面板 ====== */
    .settings-panel { position: fixed; top: 0; right: -100%; width: 85%; max-width: 400px; height: 100%; background: #fff; z-index: 100; transition: right 0.3s; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
    .settings-panel.open { right: 0; }
    .settings-header { height: 56px; background: var(--theme-color); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-weight: bold; }
    .settings-body { flex: 1; overflow-y: auto; padding: 15px; }
    .settings-group { margin-bottom: 20px; border: 1px solid #eee; border-radius: 8px; }
    .settings-title { background: #f9f9f9; padding: 10px 15px; font-size: 14px; font-weight: bold; color: #555; }
    .settings-item { padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .settings-item input[type="text"], .settings-item textarea, .settings-item input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .save-btn { width: 100%; padding: 14px; background: var(--theme-color); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
    .overlay.open { display: block; }
  </style>
</head>

      </div>

        <div class="contact-preview" id="lastMessagePreview">点击进入复习字卡吧...</div>
      </div>
    </div>
  </div>
