<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crepuscule</title>
  <style>
    /* 主题变量 */
    :root {
      --theme-color: #FFB6C1;
      --bg-color: #EEF2F7;
      --text-main: #333;
      --text-sub: #888;
      --card-bg: rgba(255, 255, 255, 0.7);
      --bubble-me: #95ec69;
      --bubble-other: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      background-image: linear-gradient(135deg, #e8f0fe 0%, #fce8e8 100%);
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    /* 视图切换 */
    .view { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
    .view.active { display: flex; }

    /* ================= 主页样式 ================= */
    #viewHome {
      overflow-y: auto;
      padding: 20px 16px 40px;
      background: transparent;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5px 20px;
      font-size: 16px;
      font-weight: 500;
      color: #555;
    }
    
    .top-bar .dots { font-size: 24px; cursor: pointer; line-height: 1; }

    /* 关系卡片 */
    .relation-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .relation-card:active { transform: scale(0.98); }

    .avatar-group { display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; }
    .avatar-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e0e0e0; /* 空白头像的默认底色 */
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 24px;
    }
    .avatar-name { font-size: 13px; color: #666; font-weight: 500; }

    /* 爱心连线 */
    .connection {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 40px;
      margin: 0 10px;
      top: -15px;
    }
    .line { width: 100%; height: 1px; background: #ffb6c1; position: absolute; z-index: 1; }
    .heart-icon { 
      color: #ff7b9c; 
      font-size: 24px; 
      background: #fff; 
      padding: 0 10px; 
      z-index: 2; 
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .card-subtitle {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      color: #bbb;
      letter-spacing: 2px;
    }

    /* 简单信息卡片 */
    .info-card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      text-align: center;
      font-size: 14px;
      color: #666;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; }
    .stats-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      text-align: center;
    }
    .stats-title { font-size: 12px; color: #999; margin-bottom: 8px; }
    .stats-value { font-size: 20px; font-weight: bold; color: #333; display: flex; align-items: center; justify-content: center; gap: 4px;}
    .stats-value span { font-size: 14px; font-weight: normal; }
    .stats-date { font-size: 11px; color: #ccc; margin-top: 8px; }

    /* 九宫格功能 */
    .grid-menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 24px 10px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .grid-icon {
      width: 56px;
      height: 56px;
      background: rgba(240, 244, 248, 0.9);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #555;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: transform 0.2s;
    }
    .grid-item:active .grid-icon { transform: scale(0.9); }
    .grid-label { font-size: 12px; color: #555; }

    /* ================= 聊天界面样式 ================= */
    .chat-container { flex: 1; background-color: var(--bg-color); background-size: cover; background-position: center; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .header { height: 56px; background: var(--theme-color); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 18px; font-weight: bold; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .header-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 5px; }
    
    .msg { display: flex; align-items: flex-start; max-width: 85%; }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg.other { align-self: flex-start; }
    .msg-avatar { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #ddd; flex-shrink: 0; }
    .msg-content { margin: 0 10px; padding: 10px 14px; border-radius: 8px; font-size: 15px; word-break: break-all; line-height: 1.4; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg.me .msg-content { background: var(--bubble-me); color: #000; }
    .msg.other .msg-content { background: var(--bubble-other); color: #000; }
    .msg.system { align-self: center; background: rgba(0,0,0,0.1); color: #666; font-size: 12px; padding: 4px 8px; border-radius: 4px; max-width: 100%; text-align: center; }

    .card-action { display: inline-block; margin-top: 8px; padding: 6px 12px; background: rgba(0,0,0,0.05); border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
    .input-bar { height: 60px; background: #f7f7f7; border-top: 1px solid #ddd; display: flex; align-items: center; padding: 0 10px; gap: 10px; }
